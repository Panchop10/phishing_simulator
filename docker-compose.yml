# Despliegue "en un comando": base de datos + aplicación.
# Las migraciones se aplican automáticamente al arrancar la app.
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-phishing}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-phishing}']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: sh -c "node node_modules/prisma/build/index.js migrate deploy && node server.js"
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-phishing}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?define SESSION_SECRET en .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?define APP_ENCRYPTION_KEY en .env}
      IP_HASH_SECRET: ${IP_HASH_SECRET:?define IP_HASH_SECRET en .env}
      APP_BASE_URL: ${APP_BASE_URL:-}
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
